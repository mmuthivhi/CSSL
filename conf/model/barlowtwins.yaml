name: "BarlowTwins"

batch_size: 256
accumulate_grad_batches: 1
epochs: 500

feature_dim: 512
hidden_dim: 2048
output_dim: 2048
num_layers: 2
projection_batchnorm: False

loss:
  scale_loss: 0.1
  lambda_param: 5.0e-3

optimizer:
    name: "lars"
    learning_rate: 0.3
    weight_decay: 1.0e-04
    momentum: 0.9
    trust_coefficient: 0.02
    clip_lr: True

# Augmentations
gaussian_blur: [0.0, 0.0]
solarization: [0.0, 0.2]
brightness: 0.4
contrast: 0.4
saturation: 0.2
hue: 0.1

set_float32_matmul_precision: "high"