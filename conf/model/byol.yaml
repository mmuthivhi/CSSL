name: "BYOL"

batch_size: 256
accumulate_grad_batches: 1
epochs: 500

feature_dim: 512
projection_hidden_dim: 4096
projection_output_dim: 256
prediction_hidden_dim: 4096

loss:
  scale_loss: 0.1
  lambda_param: 5.0e-3

momentum_encoder:
  base_tau: 0.99
  final_tau: 1.0

optimizer:
    name: "lars"
    learning_rate: 1.0
    weight_decay: 1.0e-5
    momentum: 0.9
    trust_coefficient: 0.02
    clip_lr: True

# Augmentations
gaussian_blur: [0.0, 0.0]
solarization: [0.0, 0.2]
brightness: 0.4
contrast: 0.4
saturation: 0.2
hue: 0.1

set_float32_matmul_precision: "high"